name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[desktop]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        run: python -m pytest -q tests/test_desktop.py tests/test_api/test_routes.py

      - name: Build native EXE
        run: python scripts/build_windows_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: Heaven-Agent-windows-x64
          path: dist/windows/Heaven Agent
          if-no-files-found: error
