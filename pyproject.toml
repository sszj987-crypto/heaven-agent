[project]
name = "voicefromheaven"
version = "0.1.0"
description = "让思念有回响 — 为失去挚爱之人提供跨越生死对话的 AI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "mlx-audio-plus>=0.1.8",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "pyloudnorm>=0.1.0",
    "numpy<2.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
